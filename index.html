<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STEALER 수주회 주문</title>
    <style>
        :root { --main-color: #000; --bg-color: #f2f2f2; --accent: #4a90e2; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); margin: 0; padding: 15px; color: #333; }
        .container { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        header { text-align: center; margin-bottom: 25px; border-bottom: 2px solid #000; padding-bottom: 15px; }
        h1 { font-size: 24px; letter-spacing: 4px; margin: 0; font-weight: 800; }
        p { color: #666; font-size: 12px; margin-top: 5px; }

        /* 페이지 전환 섹션 */
        #orderPage, #resultPage { display: none; }
        .active { display: block !important; }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px; }
        input[type="text"], input[type="email"] { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }

        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
        .product-card { border: 1px solid #eee; border-radius: 10px; padding: 12px; text-align: center; background: #fff; }
        .product-card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 6px; margin-bottom: 10px; background: #f9f9f9; }
        .product-name { font-size: 13px; font-weight: 600; margin-bottom: 10px; height: 32px; display: flex; align-items: center; justify-content: center; line-height: 1.2; }
        
        .qty-box { display: flex; align-items: center; justify-content: center; gap: 5px; }
        .qty-btn { width: 34px; height: 34px; border: 1px solid #000; background: white; border-radius: 5px; cursor: pointer; font-size: 18px; font-weight: bold; }
        
        /* 숫자 입력창 화살표 제거 */
        .qty-input { 
            width: 40px; 
            text-align: center; 
            border: none; 
            font-weight: bold; 
            font-size: 17px; 
            background: transparent;
            -moz-appearance: textfield; /* Firefox */
        }
        .qty-input::-webkit-outer-spin-button,
        .qty-input::-webkit-inner-spin-button {
            -webkit-appearance: none; /* Chrome, Safari, Edge */
            margin: 0;
        }

        .submit-btn { width: 100%; padding: 18px; background: var(--main-color); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .email-btn { width: 100%; padding: 15px; background: var(--accent); color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; }

        .summary-box { background: #f9f9f9; padding: 20px; border-radius: 8px; margin: 20px 0; border: 1px dashed #000; white-space: pre-wrap; font-size: 14px; text-align: left; }
        .email-section { margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee; }

        #loader { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); color: white; justify-content: center; align-items: center; z-index: 1000; font-weight: bold; }
    </style>
</head>
<body>

<div id="loader">처리 중입니다...</div>

<div class="container">
    <header>
        <h1>STEALER</h1>
        <p>2026 TRUNK SHOW ORDER</p>
    </header>

    <div id="orderPage" class="active">
        <div class="form-group">
            <label>안경원 지점명</label>
            <input type="text" id="branchName" placeholder="지점명을 입력하세요" required>
        </div>
        <div class="product-grid" id="productGrid"></div>
        <button type="button" class="submit-btn" onclick="submitOrder()">주문 제출하기</button>
    </div>

    <div id="resultPage">
        <h2 style="text-align: center; margin: 0;">주문 접수 완료</h2>
        <div class="summary-box" id="orderSummary"></div>
        <div class="email-section">
            <label>주문 내역 이메일로 받기</label>
            <p style="font-size:11px; color:#4a90e2; margin:5px 0 10px;">* hello@stealer.co.kr로 참조 발송됩니다.</p>
            <input type="email" id="userEmail" placeholder="example@email.com">
            <button type="button" class="email-btn" id="emailBtn" onclick="sendEmail()">이메일 전송하기</button>
        </div>
        <button type="button" class="submit-btn" style="background:#666;" onclick="location.reload()">처음으로</button>
    </div>
</div>

<script>
    // CC 기능이 포함된 앱스스크립트 URL 적용
    const API_URL = "https://script.google.com/macros/s/AKfycbyQTjQEPfzPCgg6U3bHbcYW22x9D4g9CGTZwsGsjmkf6uhEBiDMmYyB2rc-FDpfTVs-/exec";
    
    const products = [
        { name: "MODEL 01 - BLACK", img: "https://via.placeholder.com/300?text=MODEL+01" },
        { name: "MODEL 02 - SILVER", img: "https://via.placeholder.com/300?text=MODEL+02" },
        { name: "MODEL 03 - GOLD", img: "https://via.placeholder.com/300?text=MODEL+03" },
        { name: "MODEL 04 - BRONZE", img: "https://via.placeholder.com/300?text=MODEL+04" },
        { name: "MODEL 05 - GREY", img: "https://via.placeholder.com/300?text=MODEL+05" },
        { name: "MODEL 06 - KHAKI", img: "https://via.placeholder.com/300?text=MODEL+06" },
        { name: "MODEL 07 - NAVY", img: "https://via.placeholder.com/300?text=MODEL+07" },
        { name: "MODEL 08 - CLEAR", img: "https://via.placeholder.com/300?text=MODEL+08" },
        { name: "MODEL 09 - ROSE GOLD", img: "https://via.placeholder.com/300?text=MODEL+09" },
        { name: "MODEL 10 - DARK GREY", img: "https://via.placeholder.com/300?text=MODEL+10" }
    ];

    let currentOrder = "";
    let currentBranch = "";

    const grid = document.getElementById('productGrid');
    products.forEach((p, i) => {
        grid.innerHTML += `
            <div class="product-card">
                <img src="${p.img}">
                <div class="product-name">${p.name}</div>
                <div class="qty-box">
                    <button type="button" class="qty-btn" onclick="updateQty(${i}, -1)">-</button>
                    <input type="number" id="qty_${i}" class="qty-input" value="0" readonly>
                    <button type="button" class="qty-btn" onclick="updateQty(${i}, 1)">+</button>
                </div>
            </div>`;
    });

    function updateQty(i, d) {
        const input = document.getElementById(`qty_${i}`);
        let v = parseInt(input.value) + d;
        if (v >= 0) input.value = v;
    }

    function submitOrder() {
        currentBranch = document.getElementById('branchName').value;
        if(!currentBranch) return alert("지점명을 입력하세요.");

        let details = [];
        products.forEach((p, i) => {
            let q = document.getElementById(`qty_${i}`).value;
            if(q > 0) details.push(`${p.name} : ${q}개`);
        });

        if(details.length === 0) return alert("수량을 선택하세요.");
        currentOrder = details.join("\n");

        document.getElementById('loader').style.display = 'flex';

        const fd = new FormData();
        fd.append("action", "order");
        fd.append("branch", currentBranch);
        fd.append("order", currentOrder.replace(/\n/g, ", "));

        fetch(API_URL, { method: "POST", mode: "no-cors", body: fd })
        .then(() => {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('orderPage').classList.remove('active');
            document.getElementById('resultPage').classList.add('active');
            document.getElementById('orderSummary').innerText = `[지점명] ${currentBranch}\n\n[주문내역]\n${currentOrder}`;
        });
    }

    function sendEmail() {
        const email = document.getElementById('userEmail').value;
        if(!email.includes('@')) return alert("이메일 주소를 정확히 입력하세요.");

        const btn = document.getElementById('emailBtn');
        btn.disabled = true;
        btn.innerText = "전송 중...";

        const fd = new FormData();
        fd.append("action", "sendEmail");
        fd.append("email", email);
        fd.append("branch", currentBranch);
        fd.append("order", currentOrder);

        fetch(API_URL, { method: "POST", mode: "no-cors", body: fd })
        .then(() => {
            alert("이메일 발송 완료! 본사(hello@stealer.co.kr)로도 참조되었습니다.");
            btn.disabled = false;
            btn.innerText = "이메일 전송하기";
        })
        .catch(err => {
            alert("전송 오류: " + err);
            btn.disabled = false;
        });
    }
</script>
</body>
</html>
