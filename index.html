<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STEALER 수주회 주문</title>
    <style>
        :root { --main-color: #000; --bg-color: #f2f2f2; --accent: #4a90e2; --kakao: #fee500; --price-color: #e63946; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); margin: 0; padding: 15px 15px 120px 15px; color: #333; }
        .container { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        header { text-align: center; margin-bottom: 25px; border-bottom: 2px solid #000; padding-bottom: 15px; }
        h1 { font-size: 24px; letter-spacing: 4px; margin: 0; font-weight: 800; }
        
        #orderPage, #resultPage { display: none; }
        .active { display: block !important; }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px; }
        input[type="text"], input[type="email"] { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }

        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
        .product-card { border: 1px solid #eee; border-radius: 10px; padding: 12px; text-align: center; background: #fff; }
        .product-card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 6px; margin-bottom: 10px; background: #f9f9f9; }
        .product-name { font-size: 13px; font-weight: 600; margin-bottom: 5px; height: 32px; display: flex; align-items: center; justify-content: center; line-height: 1.2; }
        .product-price { font-size: 14px; color: var(--price-color); font-weight: bold; margin-bottom: 10px; }
        
        .qty-box { display: flex; align-items: center; justify-content: center; gap: 5px; }
        .qty-btn { width: 34px; height: 34px; border: 1px solid #000; background: white; border-radius: 5px; cursor: pointer; font-size: 18px; font-weight: bold; }
        .qty-input { width: 40px; text-align: center; border: none; font-weight: bold; font-size: 17px; background: transparent; -moz-appearance: textfield; }
        .qty-input::-webkit-outer-spin-button, .qty-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        .total-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #000; color: #fff; padding: 20px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; z-index: 999; }
        .total-amount { font-size: 20px; font-weight: bold; }

        .submit-btn { width: 100%; padding: 18px; background: var(--main-color); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .email-btn { width: 100%; padding: 15px; background: var(--accent); color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .kakao-btn { width: 100%; padding: 15px; background: var(--kakao); color: #3c1e1e; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }

        .summary-box { background: #f9f9f9; padding: 20px; border-radius: 8px; margin: 20px 0; border: 1px dashed #000; white-space: pre-wrap; font-size: 14px; }
        .contact-info { font-size: 11px; color: #888; text-align: center; margin-top: 15px; line-height: 1.6; }
        #loader { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); color: white; justify-content: center; align-items: center; z-index: 1000; font-weight: bold; }
    </style>
</head>
<body>

<div id="loader">처리 중입니다...</div>

<div id="stickyTotal" class="total-bar">
    <span style="font-size:14px; opacity:0.8;">총 주문 합계</span>
    <span class="total-amount" id="displayTotal">0원</span>
</div>

<div class="container">
    <header>
        <h1>STEALER</h1>
        <p>2026 TRUNK SHOW ORDER</p>
    </header>

    <div id="orderPage" class="active">
        <div class="form-group">
            <label>지점명</label>
            <input type="text" id="branchName" placeholder="지점명을 입력하세요" required>
        </div>
        <div class="product-grid" id="productGrid"></div>
        <button type="button" class="submit-btn" onclick="submitOrder()">주문 제출하기</button>
    </div>

    <div id="resultPage">
        <h2 style="text-align: center; margin: 0;">주문 접수 완료</h2>
        <div class="summary-box" id="orderSummary"></div>
        
        <div style="margin-top:20px;">
            <button type="button" class="kakao-btn" onclick="shareKakao()">
                <img src="https://developers.kakao.com/assets/img/about/logos/kakaotalksharing/kakaotalk_sharing_btn_small.png" width="20">
                카카오톡으로 바로 공유
            </button>
            
            <div style="margin-top:20px; border-top:1px solid #eee; padding-top:20px;">
                <label>이메일로 내역 받기</label>
                <input type="email" id="userEmail" placeholder="example@email.com">
                <button type="button" class="email-btn" id="emailBtn" onclick="sendEmail()">이메일 전송하기</button>
            </div>
        </div>
        
        <div class="contact-info">
            문의: 1588-4264<br>
            hello@stealer.co.kr | hello@muzik.co.kr
        </div>
        
        <button type="button" class="submit-btn" style="background:#666; margin-top:20px;" onclick="location.reload()">새 주문 작성</button>
    </div>
</div>

<script>
    // 2026-02-20 발행된 병합 기능 포함 신규 URL
    const API_URL = "https://script.google.com/macros/s/AKfycbx1QY7-NekpHWFrdRPC95vATpUWb1NCRkUDg7Uvu2SA4vXJmenJakO2phgCQE_zFlZY/exec";
    
    const products = [
        { name: "MODEL 01 - BLACK", price: 185000, img: "https://via.placeholder.com/300?text=01" },
        { name: "MODEL 02 - SILVER", price: 195000, img: "https://via.placeholder.com/300?text=02" },
        { name: "MODEL 03 - GOLD", price: 195000, img: "https://via.placeholder.com/300?text=03" },
        { name: "MODEL 04 - BRONZE", price: 185000, img: "https://via.placeholder.com/300?text=04" },
        { name: "MODEL 05 - GREY", price: 210000, img: "https://via.placeholder.com/300?text=05" },
        { name: "MODEL 06 - KHAKI", price: 210000, img: "https://via.placeholder.com/300?text=06" },
        { name: "MODEL 07 - NAVY", price: 185000, img: "https://via.placeholder.com/300?text=07" },
        { name: "MODEL 08 - CLEAR", price: 175000, img: "https://via.placeholder.com/300?text=08" },
        { name: "MODEL 09 - ROSE GOLD", price: 195000, img: "https://via.placeholder.com/300?text=09" },
        { name: "MODEL 10 - DARK GREY", price: 185000, img: "https://via.placeholder.com/300?text=10" }
    ];

    let currentOrderText = "";
    let currentBranch = "";
    let totalSum = 0;

    const grid = document.getElementById('productGrid');
    products.forEach((p, i) => {
        grid.innerHTML += `
            <div class="product-card">
                <img src="${p.img}">
                <div class="product-name">${p.name}</div>
                <div class="product-price">${p.price.toLocaleString()}원</div>
                <div class="qty-box">
                    <button type="button" class="qty-btn" onclick="updateQty(${i}, -1)">-</button>
                    <input type="number" id="qty_${i}" class="qty-input" value="0" readonly>
                    <button type="button" class="qty-btn" onclick="updateQty(${i}, 1)">+</button>
                </div>
            </div>`;
    });

    function updateQty(i, d) {
        const input = document.getElementById(`qty_${i}`);
        let v = parseInt(input.value) + d;
        if (v >= 0) { input.value = v; calculateTotal(); }
    }

    function calculateTotal() {
        totalSum = 0;
        products.forEach((p, i) => {
            const q = parseInt(document.getElementById(`qty_${i}`).value);
            totalSum += p.price * q;
        });
        document.getElementById('displayTotal').innerText = totalSum.toLocaleString() + "원";
    }

    function submitOrder() {
        currentBranch = document.getElementById('branchName').value;
        if(!currentBranch) return alert("지점명을 입력하세요.");
        
        let details = [];      
        let splitItems = [];   
        
        products.forEach((p, i) => {
            let q = document.getElementById(`qty_${i}`).value;
            if(q > 0) {
                details.push(`${p.name} : ${q}개`);
                splitItems.push(`${p.name}:${q}`);
            }
        });
        
        if(details.length === 0) return alert("제품을 선택하세요.");
        
        currentOrderText = `[주문내역]\n${details.join("\n")}\n\n총 합계: ${totalSum.toLocaleString()}원`;
        
        document.getElementById('loader').style.display = 'flex';

        const fd = new FormData();
        fd.append("action", "order");
        fd.append("branch", currentBranch);
        fd.append("items", splitItems.join(",")); 
        fd.append("total", totalSum.toLocaleString() + "원");
        fd.append("order", currentOrderText);

        fetch(API_URL, { method: "POST", mode: "no-cors", body: fd })
        .then(() => {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('stickyTotal').style.display = 'none';
            document.getElementById('orderPage').classList.remove('active');
            document.getElementById('resultPage').classList.add('active');
            document.getElementById('orderSummary').innerText = `[지점명] ${currentBranch}\n\n${currentOrderText}`;
        });
    }

    function sendEmail() {
        const email = document.getElementById('userEmail').value;
        if(!email.includes('@')) return alert("이메일을 정확히 입력해 주세요.");
        const btn = document.getElementById('emailBtn');
        btn.disabled = true; btn.innerText = "전송 중...";

        const fd = new FormData();
        fd.append("action", "sendEmail");
        fd.append("email", email);
        fd.append("branch", currentBranch);
        fd.append("order", currentOrderText);

        fetch(API_URL, { method: "POST", mode: "no-cors", body: fd })
        .then(() => { 
            alert("주문서가 메일로 발송되었습니다."); 
            btn.disabled = false; 
            btn.innerText = "이메일 전송하기"; 
        });
    }

    async function shareKakao() {
        const shareData = { title: 'STEALER 주문서', text: `[지점명] ${currentBranch}\n\n${currentOrderText}` };
        if (navigator.share) {
            try { await navigator.share(shareData); } catch (err) {}
        } else {
            const fallbackUrl = `https://sharer.kakao.com/talk/friends/picker/link?message=${encodeURIComponent(shareData.text)}`;
            window.open(fallbackUrl, '_blank');
        }
    }
</script>
</body>
</html>
