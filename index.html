<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STEALER / muzik 제품 주문</title>
    <style>
        :root { --main-color: #000; --bg-color: #f2f2f2; --accent: #4a90e2; --kakao: #fee500; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); margin: 0; padding: 15px 15px 120px 15px; color: #333; }
        .container { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        header { text-align: center; margin-bottom: 25px; border-bottom: 2px solid #000; padding-bottom: 15px; }
        h1 { font-size: 20px; letter-spacing: 1px; margin: 0; font-weight: 800; }
        
        #orderPage, #resultPage { display: none; }
        .active { display: block !important; }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px; }
        input[type="text"], input[type="tel"], input[type="email"] { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }

        .category-title { grid-column: span 2; background: #f8f8f8; padding: 10px; margin-top: 20px; font-weight: bold; font-size: 14px; border-left: 4px solid #000; }

        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
        .product-card { border: 1px solid #eee; border-radius: 10px; padding: 12px; text-align: center; background: #fff; display: flex; flex-direction: column; justify-content: space-between; }
        
        .img-container { width: 100%; aspect-ratio: 1/1; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #fff; margin-bottom: 10px; border-radius: 6px; }
        .img-container img { width: 100%; height: 100%; object-fit: contain; }
        
        .product-name { font-size: 12px; font-weight: 600; margin-bottom: 4px; min-height: 30px; display: flex; align-items: center; justify-content: center; line-height: 1.2; }
        .product-price { font-size: 11px; color: #888; margin-bottom: 10px; }
        
        .qty-box { display: flex; align-items: center; justify-content: center; gap: 5px; }
        .qty-btn { width: 34px; height: 34px; border: 1px solid #000; background: white; border-radius: 5px; cursor: pointer; font-size: 18px; font-weight: bold; }
        .qty-input { width: 40px; text-align: center; border: none; font-weight: bold; font-size: 17px; background: transparent; }

        .total-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #000; color: #fff; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; text-align: center; z-index: 999; }
        .total-label { font-size: 13px; opacity: 0.8; margin-bottom: 5px; }
        .total-amount { font-size: 22px; font-weight: bold; }

        .submit-btn { width: 100%; padding: 18px; background: var(--main-color); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .email-btn { width: 100%; padding: 15px; background: var(--accent); color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .kakao-btn { width: 100%; padding: 15px; background: var(--kakao); color: #3c1e1e; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }

        .summary-box { background: #f9f9f9; padding: 20px; border-radius: 8px; margin: 20px 0; border: 1px dashed #000; white-space: pre-wrap; font-size: 14px; line-height: 1.6; }
        .contact-footer { font-size: 11px; color: #888; text-align: center; margin-top: 15px; line-height: 1.6; }
        #loader { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); color: white; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; font-weight: bold; }
    </style>
</head>
<body>

<div id="loader">
    <div id="loaderText">데이터를 불러오는 중...</div>
</div>

<div id="stickyTotal" class="total-bar">
    <span class="total-label">총 주문 합계</span>
    <span class="total-amount" id="displayTotal">0원</span>
</div>

<div class="container">
    <header>
        <h1>STEALER / muzik 제품 주문</h1>
    </header>

    <div id="orderPage" class="active">
        <div class="form-group">
            <label>지점명</label>
            <input type="text" id="branchName" placeholder="지점명을 입력하세요" required>
        </div>
        <div class="form-group">
            <label>연락처</label>
            <input type="tel" id="contactNum" placeholder="연락처를 입력하세요" required>
        </div>
        
        <div class="product-grid" id="productGrid"></div>
        <button type="button" class="submit-btn" onclick="submitOrder()">주문 제출하기</button>
    </div>

    <div id="resultPage">
        <h2 style="text-align: center; margin: 0;">주문 접수 완료</h2>
        <div class="summary-box" id="orderSummary"></div>
        
        <button type="button" class="kakao-btn" onclick="shareNative()">공유하기</button>
        
        <div style="margin-top:25px; border-top:1px solid #eee; padding-top:20px;">
            <label>이메일 주문서 받기</label>
            <input type="email" id="userEmail" placeholder="example@email.com">
            <button type="button" class="email-btn" id="emailBtn" onclick="sendEmail()">이메일 전송</button>
        </div>
        
        <div class="contact-footer">
            문의: 1588-4264<br>
            hello@stealer.co.kr | hello@muzik.co.kr
        </div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzTCqYiF6j42VleizLlaGkahj_zAIVaqAWproOzNs1qpxpfWJWkFh1TIXpqSkS3Ztc/exec";
    
    let products = [];
    let totalSum = 0;

    // 페이지 로드 시 구글 시트에서 제품 정보 가져오기
    window.onload = function() {
        document.getElementById('loader').style.display = 'flex';
        
        // 구글 앱스클립트의 getProductData 함수 실행
        google.script.run.withSuccessHandler(function(data) {
            products = data;
            renderProducts();
            document.getElementById('loader').style.display = 'none';
        }).getProductData();
    };

    function renderProducts() {
        const grid = document.getElementById('productGrid');
        grid.innerHTML = '';
        
        products.forEach((p, i) => {
            if(p.cat) grid.innerHTML += `<div class="category-title">${p.cat}</div>`;
            grid.innerHTML += `
                <div class="product-card">
                    <div class="img-container"><img src="${p.img}"></div>
                    <div class="product-name">${p.name}</div>
                    <div class="product-price">${p.price.toLocaleString()}원</div>
                    <div class="qty-box">
                        <button type="button" class="qty-btn" onclick="updateQty(${i}, -1)">-</button>
                        <input type="number" id="qty_${i}" class="qty-input" value="0" readonly>
                        <button type="button" class="qty-btn" onclick="updateQty(${i}, 1)">+</button>
                    </div>
                </div>`;
        });
    }

    function updateQty(i, d) {
        const input = document.getElementById(`qty_${i}`);
        let v = parseInt(input.value) + d;
        if (v >= 0) { input.value = v; calculateTotal(); }
    }

    function calculateTotal() {
        totalSum = 0;
        products.forEach((p, i) => {
            const q = parseInt(document.getElementById(`qty_${i}`).value);
            totalSum += p.price * q;
        });
        document.getElementById('displayTotal').innerText = totalSum.toLocaleString() + "원";
    }

    function submitOrder() {
        const branch = document.getElementById('branchName').value;
        const contact = document.getElementById('contactNum').value;
        if(!branch || !contact) return alert("지점명과 연락처를 입력하세요.");
        
        let details = []; let splitItems = [];   
        products.forEach((p, i) => {
            let q = document.getElementById(`qty_${i}`).value;
            if(q > 0) {
                details.push(`${p.name} : ${q}개`);
                splitItems.push(`${p.name}:${q}`);
            }
        });
        if(details.length === 0) return alert("수량을 선택하세요.");
        
        const summaryText = `[지점명] ${branch}\n[연락처] ${contact}\n\n[주문내역]\n${details.join("\n")}\n\n총 합계: ${totalSum.toLocaleString()}원`;
        
        document.getElementById('loaderText').innerText = "주문을 전송 중입니다...";
        document.getElementById('loader').style.display = 'flex';

        const fd = new FormData();
        fd.append("action", "order");
        fd.append("branch", branch + " / " + contact);
        fd.append("items", splitItems.join(",")); 
        fd.append("total", totalSum.toLocaleString() + "원");
        fd.append("order", summaryText);

        fetch(API_URL, { method: "POST", mode: "no-cors", body: fd })
        .then(() => {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('stickyTotal').style.display = 'none';
            document.getElementById('orderPage').classList.remove('active');
            document.getElementById('resultPage').classList.add('active');
            document.getElementById('orderSummary').innerText = summaryText;
            window.scrollTo(0,0);
        });
    }

    function sendEmail() {
        const email = document.getElementById('userEmail').value;
        if(!email.includes('@')) return alert("이메일을 확인하세요.");
        const btn = document.getElementById('emailBtn');
        btn.disabled = true; btn.innerText = "전송 중...";

        const fd = new FormData();
        fd.append("action", "sendEmail");
        fd.append("email", email);
        fd.append("branch", document.getElementById('branchName').value);
        fd.append("order", document.getElementById('orderSummary').innerText);

        fetch(API_URL, { method: "POST", mode: "no-cors", body: fd })
        .then(() => { alert("전송 완료!"); btn.disabled = false; btn.innerText = "이메일 전송"; });
    }

    function shareNative() {
        const text = document.getElementById('orderSummary').innerText;
        if (navigator.share) {
            navigator.share({ title: '주문내역', text: text }).catch(()=>{});
        } else {
            alert("내역을 복사하여 전달해주세요.");
        }
    }
</script>
</body>
</html>
